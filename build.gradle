// PORT NOTE: Rewritten from ForgeGradle 6 + MixinGradle + Librarian to ModDevGradle 2 for NeoForge 1.21.1.
// Mixins on NeoForge need no refmap (runtime uses official mappings), so MixinGradle and the
// annotation processor are gone. `reobfJar` no longer exists either: the plain `jar` is the
// distributable artifact. Dummmmmmy and Moonlight/Selene were compile-only dependencies that
// nothing in the source referenced, so they have been dropped.
plugins{
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = "pro.komaru"
version = "${version}"
base{
    archivesName = "Tridot"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories{
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
    maven{
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content{
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets.main.resources{ srcDir 'src/generated/resources' }

neoForge{
    version = project.neo_version

    parchment{
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up by default; publish it so
    // dependents (Valoria) get the same widened access in their dev environments.
    accessTransformers{
        publish(project.file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    runs{
        configureEach{
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tridot'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client{
            client()
        }

        server{
            server()
            programArgument '--nogui'
        }

        gameTestServer{
            type = 'gameTestServer'
        }

        data{
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', 'tridot', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods{
        "tridot"{
            sourceSet sourceSets.main
        }
    }
}

dependencies{
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // PORT NOTE: Oculus (Forge) is replaced by Iris' own NeoForge build; same net.irisshaders.iris API.
    compileOnly "maven.modrinth:iris:${iris_version}"
}

task apiJar(type: Jar) {
    archiveClassifier.set('api')
    from sourceSets.main.allSource
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task javadocJar(type: Jar) {
    dependsOn javadoc
    from javadoc.destinationDir
    archiveClassifier.set('javadoc')
}

artifacts {
    archives sourcesJar
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_version            : version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact apiJar
        }
    }

    repositories{
        maven{
            url "https://repo.komaru.studio/releases"
            credentials{
                username "admin"
                password System.getenv("maventoken")
            }
        }
    }
}

jar {
    manifest {
        attributes(["Specification-Title"     : project.name,
                    "Specification-Vendor"    : "IriDark, Auriny, Skoow",
                    "Specification-Version"   : 1,
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : "IriDark, Auriny, Skoow",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")],)
    }
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
